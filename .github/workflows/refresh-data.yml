name: Refresh geomagnetic data

on:
  schedule:
    # 06:17 UTC every Monday -- an off-the-hour time, see CI guidance on avoiding :00/:30 stampedes
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild data from VirES (stdlib-only, no dependencies to install)
        env:
          VIRES_TOKEN: ${{ secrets.VIRES_TOKEN }}
        run: python3 scripts/build_data.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "geomagnetic-drift-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No data changes."
          else
            git add data/igrf_data.js data/chaos_fine_data.js
            git commit -m "Scheduled data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
