name: Refresh geomagnetic data

on:
  schedule:
    # 06:17 UTC every Monday -- an off-the-hour time, see CI guidance on avoiding :00/:30 stampedes
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

# never let a slow run overlap the next one (both would try to commit the same files)
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # A cheap authenticated call before the 17-minute rebuild, with a plain-language
      # verdict in the log. Never prints the token itself. The secret may be either the bare
      # token or a pasted "Authorization: Bearer <token>" line -- both are accepted.
      - name: Preflight VirES connectivity (diagnostics)
        env:
          VIRES_TOKEN: ${{ secrets.VIRES_TOKEN }}
        run: |
          t="$(printf '%s' "$VIRES_TOKEN" | sed -E 's/^[[:space:]]*(Authorization:[[:space:]]*)?(Bearer[[:space:]]+)?//I; s/[[:space:]"'"'"']+$//')"
          echo "egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "secret length: ${#VIRES_TOKEN}, token length after normalising: ${#t}"
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $t" \
            'https://vires.services/ows?service=WPS&request=GetCapabilities' || echo 000)
          echo "GetCapabilities -> HTTP $code"
          case "$code" in
            200) echo "VirES reachable and the token is accepted." ;;
            401|403) echo "::error::VirES rejected the token. Re-enter the VIRES_TOKEN secret with ONLY the token value from vires.services (no 'Authorization:' or 'Bearer')."; exit 1 ;;
            000) echo "::error::Could not reach vires.services from this runner."; exit 1 ;;
            *) echo "::warning::Unexpected status $code from VirES; continuing, the build will retry." ;;
          esac

      - name: Rebuild data from VirES (stdlib-only, no dependencies to install)
        env:
          VIRES_TOKEN: ${{ secrets.VIRES_TOKEN }}
        run: python3 -u scripts/build_data.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "geomagnetic-drift-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No data changes."
          else
            git add data/igrf_data.js data/chaos_fine_data.js
            git commit -m "Scheduled data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
