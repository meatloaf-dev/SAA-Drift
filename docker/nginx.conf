server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # the data files are megabytes of JSON-in-JS; GitHub Pages gzips them, so do the same
    # here or local load times are misleading
    gzip on;
    gzip_types application/javascript text/html text/css application/json;
    gzip_min_length 1024;

    # dev server: never cache, so a reload always shows the current file on disk
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    etag off;

    location / {
        try_files $uri $uri/ =404;
    }
}
